[package]
name = "frost-studio-daw"
version = "0.1.0"
description = "Frost Studio DAW - A High-Performance Digital Audio Workstation"
authors = ["Frost Studio Team"]
edition = "2021"

[lib]
name = "frost_studio_daw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.4"
# Using raw-window-handle to pass handles to the VST
raw-window-handle = "0.5"
cpal = { workspace = true }
ringbuf = { workspace = true }
frost-core = { path = "../frost-core" }
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
